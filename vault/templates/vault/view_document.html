<!DOCTYPE html>
<html>
<head>
    <title>View Document - TrustVault</title>
</head>
<body>

    <h1>TrustVault - Document Details</h1>

    <h2>{{ document.title }}</h2>

    <p>{{ document.description }}</p>

    <p>Category: {{ document.category }}</p>

    <p>Owner: {{ document.owner.username }}</p>

    <h3>Document File</h3>

    <a href="{% url 'download_document' document.id %}">
        <button type="button">Download Document</button>
    </a>

    <br><br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</body>
</html>
