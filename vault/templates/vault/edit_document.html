<!DOCTYPE html>
<html>
<head>
    <title>Edit Document - TrustVault</title>
</head>
<body>

    <h1>Edit Document</h1>

    <h3>{{ document.title }}</h3>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Update Document</button>
    </form>

    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</body>
</html>
